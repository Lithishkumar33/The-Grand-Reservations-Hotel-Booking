{% extends 'admin/partials/admin_navbar.html' %}
{% block content %}

<style>

body {
    background: #f8fafc;
    font-family: 'Inter', sans-serif;
}

/* CARD */
.form-card {
    background: #fff;
    border-radius: 14px;
    padding: 25px;
    box-shadow: 0 10px 25px rgba(0,0,0,0.05);
}

/* TITLE */
.form-title {
    font-weight: 600;
    margin-bottom: 20px;
}

/* INPUT */
.form-control {
    border-radius: 8px;
    border: 1px solid #e5e7eb;
    font-size: 14px;
    padding: 10px;
}

.form-control:focus {
    border-color: #111827;
    box-shadow: none;
}

/* LABEL */
label {
    font-size: 13px;
    font-weight: 500;
    color: #374151;
}

/* SWITCH */
.switch {
    display: flex;
    align-items: center;
}

.switch input {
    margin-right: 10px;
}

/* IMAGE GRID */
.img-box {
    border-radius: 10px;
    overflow: hidden;
    transition: 0.3s;
}

.img-box img {
    width: 100%;
    height: 120px;
    object-fit: cover;
}

.img-box:hover {
    transform: scale(1.05);
}

/* BUTTONS */
.btn-save {
    background: #111827;
    color: #fff;
    border-radius: 8px;
}

.btn-save:hover {
    background: #000;
}

.btn-cancel {
    border: 1px solid #6b7280;
    color: #6b7280;
    border-radius: 8px;
}

.btn-cancel:hover {
    background: #6b7280;
    color: #fff;
}

</style>

<div class="container mt-4">

<div class="form-card">

<h4 class="form-title">Edit Room</h4>

<form method="post" enctype="multipart/form-data">
{% csrf_token %}

<div class="row">

    <!-- LEFT -->
    <div class="col-md-6">

        <div class="form-group">
            <label>Room Number</label>
            <input name="room_number"
                   class="form-control"
                   value="{{ room.room_number }}" required>
        </div>

        <div class="form-group">
            <label>Room Type</label>
            <input name="room_type"
                   class="form-control"
                   value="{{ room.room_type }}" required>
        </div>

        <div class="form-group">
            <label>Hotel Name</label>
            <input name="hotel"
                   class="form-control"
                   value="{{ room.hotel }}" required>
        </div>

        <div class="form-group">
            <label>Location</label>
            <input name="location"
                   class="form-control"
                   value="{{ room.location }}" required>
        </div>

    </div>

    <!-- RIGHT -->
    <div class="col-md-6">

        <div class="form-group">
            <label>Room Only Price</label>
            <input type="number"
                   name="price_room_only"
                   value="{{ room.price_room_only }}"
                   class="form-control" required>
        </div>

        <div class="form-group">
            <label>Price With Breakfast</label>
            <input type="number"
                   name="price_with_breakfast"
                   value="{{ room.price_with_breakfast }}"
                   class="form-control" required>
        </div>

        <div class="form-group">
            <label>Price With Breakfast + Dinner</label>
            <input type="number"
                   name="price_with_breakfast_dinner"
                   value="{{ room.price_with_breakfast_dinner }}"
                   class="form-control" required>
        </div>

        <div class="form-group">
            <label>Description</label>
            <textarea name="description"
                      class="form-control"
                      rows="3">{{ room.description }}</textarea>
        </div>

        <div class="form-group switch">
            <input type="checkbox"
                   name="is_available"
                   {% if room.is_available %}checked{% endif %}>
            <label>Available</label>
        </div>

    </div>

</div>

<hr>

<!-- IMAGES -->
<h6 class="mb-3">Existing Images</h6>

<div class="row">

{% for img in room.images.all %}
<div class="col-md-3 mb-3">
    <div class="img-box">
        <img src="{{ img.image.url }}">
    </div>
</div>
{% empty %}
<p class="text-muted ml-3">No images uploaded</p>
{% endfor %}

</div>

<div class="form-group">
    <label>Add More Images</label>
    <input type="file" name="images" multiple class="form-control">
</div>

<!-- BUTTONS -->
<div class="mt-3">

<button class="btn btn-save">
    Save Changes
</button>

<a href="/admin/rooms/" class="btn btn-cancel ml-2">
    Cancel
</a>

</div>

</form>

</div>

</div>

{% endblock %}
