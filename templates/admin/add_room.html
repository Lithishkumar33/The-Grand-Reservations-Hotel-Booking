<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Add Room | Admin</title>

    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css">

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

    <style>
        body {
            background: #f8fafc;
            font-family: 'Inter', sans-serif;
        }

        .form-card {
            background: #fff;
            border-radius: 14px;
            padding: 25px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.05);
        }

        .form-title {
            font-weight: 600;
            margin-bottom: 20px;
        }

        label {
            font-size: 13px;
            font-weight: 500;
            color: #374151;
        }

        .form-control {
            border-radius: 8px;
            border: 1px solid #e5e7eb;
            font-size: 14px;
            padding: 10px;
        }

        .form-control:focus {
            border-color: #111827;
            box-shadow: none;
        }

        .btn-save {
            background: #111827;
            color: #fff;
            border-radius: 8px;
        }

        .btn-save:hover {
            background: #6b7280;
        }

        .btn-cancel {
            border: 1px solid #6b7280;
            color: #6b7280;
            border-radius: 8px;
        }

        .btn-cancel:hover {
            background: #6b7280;
            color: #fff;
        }

        .helper {
            font-size: 12px;
            color: #6b7280;
        }

        .price-section {
            background: #f9fafb;
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 15px;
        }

        .price-title {
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 10px;
        }

    </style>

</head>

<body>

{% include 'admin/partials/admin_navbar.html' %}

<div class="container mt-4">

    <div class="form-card">

        <h4 class="form-title">Add New Room</h4>

        <form method="post" enctype="multipart/form-data">
            {% csrf_token %}

            <div class="row">

                <!-- LEFT -->
                <div class="col-md-6">

                    <div class="form-group">
                        <label>Room Number</label>
                        <input name="room_number" class="form-control" required>
                    </div>

                    <div class="form-group">
                        <label>Room Type</label>
                        <select name="room_type" class="form-control" required>
                            <option value="">Select Type</option>
                            <option>Single</option>
                            <option>Double</option>
                            <option>Deluxe</option>
                            <option>Suite</option>
                        </select>
                    </div>
                    <div class="form-group">
    <label>Hotel Name</label>
    <input type="text" name="hotel" class="form-control" placeholder="Enter hotel name" required>
</div>
                    <div class="form-group">
                        <label>Location</label>
                        <input type="text"
                               name="location"
                               class="form-control"
                               placeholder="Goa, Ooty, Bangalore"
                               required>
                    </div>

                </div>

                <!-- RIGHT -->
                <div class="col-md-6">

                    <!-- 🔥 PRICING SECTION -->
                    <div class="price-section">
                        <div class="price-title">Room Pricing (Per Day)</div>

                        <div class="form-group">
                            <label>Room Only</label>
                            <input name="price_room_only" type="number" class="form-control" required>
                        </div>

                        <div class="form-group">
                            <label>Room + Breakfast</label>
                            <input name="price_with_breakfast" type="number" class="form-control" required>
                        </div>

                        <div class="form-group">
                            <label>Room + Breakfast + Dinner</label>
                            <input name="price_with_breakfast_dinner" type="number" class="form-control" required>
                        </div>
                    </div>

                    <div class="form-group">
                        <label>Description</label>
                        <textarea name="description"
                                  class="form-control"
                                  rows="4"></textarea>
                    </div>

                    <div class="form-group">
                        <label>Room Images</label>
                        <input type="file"
                               name="images"
                               class="form-control"
                               multiple
                               required>

                        <div class="helper">
                            Upload 4–5 images (different angles)
                        </div>
                    </div>

                </div>

            </div>

            <!-- BUTTONS -->
            <div class="mt-3">

                <button class="btn btn-save">
                    Save Room
                </button>

                <a href="/admin/dashboard/" class="btn btn-cancel ml-2">
                    Cancel
                </a>

            </div>

        </form>

    </div>

</div>

</body>
</html>
