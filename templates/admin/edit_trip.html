{% extends 'admin/partials/admin_navbar.html' %}

{% block content %}

<style>

/* CARD */
.form-card {
    background: #fff;
    border-radius: 14px;
    padding: 25px;
    box-shadow: 0 10px 25px rgba(0,0,0,0.05);
}

/* TITLE */
.form-title {
    font-weight: 600;
    margin-bottom: 20px;
}

/* LABEL */
label {
    font-size: 13px;
    font-weight: 500;
    color: #374151;
}

/* INPUT */
.form-control {
    border-radius: 8px;
    border: 1px solid #e5e7eb;
    font-size: 14px;
    padding: 10px;
}

.form-control:focus {
    border-color: #111827;
    box-shadow: none;
}

/* IMAGE */
.img-preview {
    border-radius: 10px;
    overflow: hidden;
    width: 100%;
    max-width: 200px;
}

.img-preview img {
    width: 100%;
    height: 120px;
    object-fit: cover;
}

/* BUTTONS */
.btn-save {
    background: #111827;
    color: #fff;
    border-radius: 6px;
    font-size: 13px;
}

.btn-save:hover {
    background: #000;
}

.btn-cancel {
    border: 1px solid #6b7280;
    color: #6b7280;
    border-radius: 6px;
    font-size: 13px;
}

.btn-cancel:hover {
    background: #6b7280;
    color: #fff;
}

</style>

<div class="container mt-4">

<div class="form-card">

<h4 class="form-title">Edit Trip</h4>

<form method="post" enctype="multipart/form-data">
{% csrf_token %}

<div class="row">

    <!-- LEFT -->
    <div class="col-md-6">

        <div class="form-group">
            <label>Trip Name</label>
            <input name="trip_name"
                   value="{{ trip.trip_name }}"
                   class="form-control" required>
        </div>

        <div class="form-group">
            <label>Destination</label>
            <input name="destination"
                   value="{{ trip.destination }}"
                   class="form-control" required>
        </div>

        <div class="form-group">
            <label>Price With Guide</label>
            <input type="number"
                   name="price_with_guide"
                   value="{{ trip.price_with_guide }}"
                   class="form-control" required>
        </div>

        <div class="form-group">
            <label>Price Without Guide</label>
            <input type="number"
                   name="price_without_guide"
                   value="{{ trip.price_without_guide }}"
                   class="form-control" required>
        </div>

    </div>

    <!-- RIGHT -->
    <div class="col-md-6">

        <div class="form-group">
            <label>Description</label>
            <textarea name="description"
                      class="form-control"
                      rows="5">{{ trip.description }}</textarea>
        </div>

        <!-- IMAGE PREVIEW -->
        <div class="form-group">
            <label>Current Image</label>

            {% if trip.image %}
                <div class="img-preview">
                    <img src="{{ trip.image.url }}">
                </div>
            {% else %}
                <p class="text-muted">No image</p>
            {% endif %}
        </div>

        <!-- UPLOAD -->
        <div class="form-group">
            <label>Change Image</label>
            <input type="file" name="image" class="form-control">
        </div>

    </div>

</div>

<!-- ACTIONS -->
<div class="mt-3">

<button class="btn btn-save">
    Update Trip
</button>

<a href="/admin/trips/" class="btn btn-cancel ml-2">
    Cancel
</a>

</div>

</form>

</div>

</div>

{% endblock %}
