{% extends 'admin/partials/admin_navbar.html' %}

{% block title %}Add Trip{% endblock %}

{% block content %}

<style>

/* PAGE TITLE */
.page-title {
    font-weight: 600;
    color: #111827;
}

/* CARD */
.form-card {
    background: #fff;
    border-radius: 14px;
    padding: 25px;
    box-shadow: 0 10px 25px rgba(0,0,0,0.05);
}

/* LABEL */
label {
    font-size: 13px;
    font-weight: 500;
    color: #374151;
}

/* INPUT */
.form-control {
    border-radius: 8px;
    border: 1px solid #e5e7eb;
    font-size: 14px;
    padding: 10px;
}

.form-control:focus {
    border-color: #111827;
    box-shadow: none;
}

/* BUTTONS */
.btn-save {
    background: #111827;
    color: #fff;
    border-radius: 6px;
    font-size: 13px;
}

.btn-save:hover {
    background: #000;
}

.btn-cancel {
    border: 1px solid #6b7280;
    color: #6b7280;
    border-radius: 6px;
    font-size: 13px;
}

.btn-cancel:hover {
    background: #6b7280;
    color: #fff;
}

/* HELPER */
.helper {
    font-size: 12px;
    color: #6b7280;
}

</style>

<div class="d-flex justify-content-between align-items-center mb-3">
    <h4 class="page-title">Add New Trip</h4>
</div>

<div class="form-card">

<form method="post" enctype="multipart/form-data">
{% csrf_token %}

<div class="row">

    <!-- LEFT -->
    <div class="col-md-6">

        <div class="form-group">
            <label>Trip Name</label>
            <input name="trip_name" class="form-control" required>
        </div>

        <div class="form-group">
            <label>Destination</label>
            <input name="destination" class="form-control" required>
        </div>
        
        <div class="form-group">
            <label>Package (Days)</label>
            <input type="number" name="package_days" class="form-control" required>
        </div>
        
        <div class="form-group">
            <label>Route</label>
            <textarea name="route"
              class="form-control"
              rows="3"
              placeholder="Ex: Bangalore → Mysore → Ooty"></textarea>
        </div>

        <div class="form-group">
            <label>Trip Image</label>
            <input type="file" name="image" class="form-control">
            <div class="helper">Upload a high-quality image</div>
        </div>

    </div>

    <!-- RIGHT -->
    <div class="col-md-6">

        <div class="form-group">
            <label>Price With Guide</label>
            <input name="price_with_guide" type="number" class="form-control" required>
        </div>

        <div class="form-group">
            <label>Price Without Guide</label>
            <input name="price_without_guide" type="number" class="form-control" required>
        </div>

        <div class="form-group">
            <label>Show in Dream Destinations</label>
            <select name="famous_place" class="form-control">
                <option value="False">Normal Trip</option>
                <option value="True">Dream Destination</option>
            </select>
        </div>

    </div>

</div>

<div class="form-group">
    <label>Description</label>
    <textarea name="description" class="form-control" rows="3"></textarea>
</div>

<!-- ACTIONS -->
<div class="mt-3">

<button class="btn btn-save">
    + Add Trip
</button>

<a href="/admin/trips/" class="btn btn-cancel ml-2">
    Cancel
</a>

</div>

</form>

</div>

{% endblock %}
