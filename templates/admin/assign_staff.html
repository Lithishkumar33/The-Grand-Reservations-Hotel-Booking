{% extends 'admin/partials/admin_navbar.html' %}

{% block content %}

<style>

/* CARD */
.assign-card {
    background: #fff;
    border-radius: 14px;
    padding: 25px;
    box-shadow: 0 10px 25px rgba(0,0,0,0.05);
}

/* TITLE */
.page-title {
    font-weight: 600;
    margin-bottom: 20px;
}

/* INFO BOX */
.info-box {
    background: #f8fafc;
    border-radius: 10px;
    padding: 15px;
    margin-bottom: 20px;
}

.info-label {
    font-size: 12px;
    color: #6b7280;
}

.info-value {
    font-weight: 500;
}

/* INPUT */
.form-control {
    border-radius: 8px;
    border: 1px solid #e5e7eb;
    font-size: 14px;
    padding: 10px;
}

.form-control:focus {
    border-color: #111827;
    box-shadow: none;
}

/* BUTTONS */
.btn-assign {
    background: #111827;
    color: #fff;
    border-radius: 6px;
    font-size: 13px;
}

.btn-assign:hover {
    background: #000;
}

.btn-cancel {
    border: 1px solid #6b7280;
    color: #6b7280;
    border-radius: 6px;
    font-size: 13px;
}

.btn-cancel:hover {
    background: #6b7280;
    color: #fff;
}

</style>

<div class="container mt-4">

    <div class="assign-card">

        <h4 class="page-title">Assign Staff</h4>

        <!-- INFO -->
        <div class="info-box">
            <div class="row">
                <div class="col-md-6">
                    <div class="info-label">Trip</div>
                    <div class="info-value">{{ booking.trip.trip_name }}</div>
                </div>

                <div class="col-md-6">
                    <div class="info-label">User</div>
                    <div class="info-value">{{ booking.user.username }}</div>
                </div>
            </div>
        </div>

        <!-- FORM -->
        <form method="post">
            {% csrf_token %}

            <div class="form-group">
                <label>Staff Name</label>
                <input type="text"
                       name="staff"
                       class="form-control"
                       placeholder="Enter staff name"
                       required>
            </div>

            <!-- ACTIONS -->
            <div class="mt-3">

                <button class="btn btn-assign">
                    Assign Staff
                </button>

                <a href="/admin/trip-bookings/"
                   class="btn btn-cancel ml-2">
                    Cancel
                </a>

            </div>

        </form>

    </div>

</div>

{% endblock %}
