<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Admin Login | The Grand Reservations</title>

<link rel="stylesheet"
href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css">

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Cinzel:wght@600&display=swap" rel="stylesheet">

<style>

body {
    margin: 0;
    height: 100vh;
    font-family: 'Inter', sans-serif;
    background: linear-gradient(135deg,#0f172a,#020617);
    display: flex;
    align-items: center;
    justify-content: center;
}

/* ✨ CARD */
.admin-card {
    width: 100%;
    max-width: 420px;

    background: rgba(255,255,255,0.04);
    backdrop-filter: blur(20px);

    border-radius: 16px;
    padding: 40px;

    border: 1px solid rgba(255,255,255,0.08);

    box-shadow: 0 10px 40px rgba(0,0,0,0.6);

    /* 🔥 ENTRY ANIMATION */
    animation: fadeUp 0.8s ease;
}

@keyframes fadeUp {
    from {
        opacity: 0;
        transform: translateY(30px) scale(0.98);
    }
    to {
        opacity: 1;
        transform: translateY(0) scale(1);
    }
}

/* 🌈 BRAND */
.brand {
    font-family: 'Cinzel', serif;
    font-size: 16px;
    letter-spacing: 3px;
    text-align: center;

    background: linear-gradient(90deg,#facc15,#fb7185,#38bdf8);
    -webkit-background-clip: text;
    color: transparent;

    margin-bottom: 8px;

    /* subtle fade */
    animation: fadeIn 1.2s ease;
}

.title {
    text-align: center;
    font-size: 20px;
    font-weight: 600;
    color: #fff;

    margin-bottom: 30px;

    animation: fadeIn 1.4s ease;
}

@keyframes fadeIn {
    from {opacity:0;}
    to {opacity:1;}
}

/* INPUT */
.form-control {
    height: 48px;
    border-radius: 10px;
    border: 1px solid rgba(255,255,255,0.1);

    background: rgba(255,255,255,0.03);
    color: #fff;

    font-size: 14px;

    transition: all 0.25s ease;
}

/* 🔥 INPUT FOCUS EFFECT */
.form-control:focus {
    border-color: #6366f1;
    background: rgba(255,255,255,0.06);
    transform: translateY(-1px);
}

/* BUTTON */
.btn-admin {
    height: 48px;
    border-radius: 10px;
    border: none;

    background: #6366f1;
    color: #fff;

    font-weight: 500;
    letter-spacing: 0.5px;

    transition: all 0.25s ease;
}

/* 🔥 BUTTON HOVER */
.btn-admin:hover {
    background: #4f46e5;
    transform: translateY(-2px);
    box-shadow: 0 8px 20px rgba(79,70,229,0.4);
}

/* 🔥 BUTTON CLICK */
.btn-admin:active {
    transform: scale(0.97);
}

/* FOOTER */
.footer-text {
    text-align: center;
    font-size: 12px;
    color: #9ca3af;
    margin-top: 20px;

    animation: fadeIn 1.6s ease;
}

</style>
</head>

<body>

<div class="admin-card">

<div class="brand">THE GRAND RESERVATIONS</div>

<div class="title">Admin Access</div>

<form method="post" autocomplete="off">
{% csrf_token %}

<div class="form-group">
<input name="username"
class="form-control"
placeholder="Username"
required>
</div>

<div class="form-group">
<input name="password"
type="password"
autocomplete="new-password"
class="form-control"
placeholder="Password"
required>
</div>

<button class="btn btn-admin btn-block">
Sign In
</button>

</form>

<div class="footer-text">
Restricted Access • Authorized Personnel Only
</div>

</div>

</body>
</html>
