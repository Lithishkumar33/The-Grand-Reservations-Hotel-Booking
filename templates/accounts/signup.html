{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Signup | The Grand Reservations</title>

<link rel="stylesheet"
href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css">

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&family=Cinzel:wght@500;600&display=swap" rel="stylesheet">

<style>

* {
    box-sizing: border-box;
}

body {
    font-family: 'Poppins', sans-serif;
    min-height: 100vh;
    margin: 0;

    background: linear-gradient(-60deg,#0f172a,#1e3a8a,#6d28d9,#be185d);
    background-size: 500% 500%;
    animation: gradientMove 10s ease infinite;

    color: #fff;
}

@keyframes gradientMove {
    0% { background-position: 0% 50%; }
    50% { background-position: 100% 50%; }
    100% { background-position: 0% 50%; }
}

/* TOP BAR */
.top-bar {
    padding: 15px 40px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    width: 100%;
}

.brand {
    font-family: 'Cinzel', serif;
    font-size: 22px;
    font-weight: 600;
    letter-spacing: 2px;
}

.admin-btn {
    border: 1px solid rgba(255,255,255,0.4);
    padding: 8px 18px;
    border-radius: 25px;
    text-decoration: none;
    color: #fff;
    transition: 0.3s;
}

.admin-btn:hover {
    background: rgba(255,255,255,0.15);
}

/* MAIN */
.auth-container {
    display: flex;
    justify-content: center;
    align-items: center;
    height: calc(100vh - 50px);
    padding: 20px;
}

.auth-box {
    display: flex;
    width: 100%;
    max-width: 900px;   /* 🔥 reduced from 1000px */

    border-radius: 20px;
    overflow: hidden;

    background: rgba(255,255,255,0.08);
    backdrop-filter: blur(18px);
    border: 1px solid rgba(255,255,255,0.1);
    box-shadow: 0 40px 80px rgba(0,0,0,0.6);
}

/* LEFT IMAGE */
.auth-left {
    flex: 0.9;
   max-height: 500px;
}

.auth-left img {
    width: 100%;
    height: 100%;
    object-fit: cover;
}

/* RIGHT FORM */
.auth-right {
    flex: 1.1;
    background: #ffffff;
    color: #111;
    padding: 40px;
}

.auth-right h4 {
    font-weight: 600;
    margin-bottom: 20px;
}

/* INPUT */
.form-control {
    border-radius: 10px;
    border: 1px solid #ddd;
    padding: 10px;
    transition: 0.3s;
}

.form-control:focus {
    border-color: #6366f1;
    box-shadow: 0 0 10px rgba(99,102,241,0.4);
}

/* BUTTON */
.btn-signup {
    background: linear-gradient(45deg,#6366f1,#ec4899);
    color: #fff;
    border: none;
    border-radius: 10px;
    font-weight: 600;
    transition: 0.3s;
}

.btn-signup:hover {
    transform: scale(1.05);
    box-shadow: 0 0 20px rgba(236,72,153,0.5);
}

.login-link {
    text-align: center;
    margin-top: 15px;
    font-size: 14px;
}

.login-link a {
    color: #6366f1;
    font-weight: 500;
}

</style>
</head>

<body>

<div class="top-bar">
    <div class="brand">The Grand Reservations</div>
</div>

<div class="auth-container">

<div class="auth-box">

    <!-- LEFT IMAGE -->
    <div class="auth-left">
        <img src="{% static 'images/goa1.jpg' %}">
    </div>

    <!-- RIGHT FORM -->
    <div class="auth-right">

        <h4>Create Account</h4>
        <!-- 🔥 ERROR MESSAGE -->

{% if error %}

<div class="alert alert-danger alert-dismissible fade show mt-3">

    {{ error }}

    <button type="button"
            class="close"
            data-dismiss="alert">

        &times;

    </button>

</div>

{% endif %}

<!-- 🔥 SUCCESS MESSAGE -->

{% if messages %}

    {% for message in messages %}

    <div class="alert alert-success alert-dismissible fade show mt-3">

        {{ message }}

        <button type="button"
                class="close"
                data-dismiss="alert">

            &times;

        </button>

    </div>

    {% endfor %}

{% endif %}

        <form method="post">
            {% csrf_token %}

            <div class="form-group">
                <label>Username</label>
                <input name="username" class="form-control" required>
            </div>

            <div class="form-group">
                <label>Email</label>
                <input name="email" type="email" class="form-control" required>
            </div>

            <div class="form-group">
                <label>Password</label>
                <input name="password" type="password" class="form-control" required
                   pattern="^(?=.*[a-z])(?=.*[A-Z])(?=.*\d)(?=.*[@$!%*?&]).{8,}$"

        title="Password must contain at least 8 characters, one uppercase letter, one lowercase letter, one number, and one special character."
                
                >
            </div>

            <button class="btn btn-signup btn-block mt-3">
                Sign Up
            </button>

        </form>

        <div class="login-link">
            Already have an account?
            <a href="/accounts/login/">Login</a>
        </div>

    </div>

</div>

</div>
<script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"></script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
