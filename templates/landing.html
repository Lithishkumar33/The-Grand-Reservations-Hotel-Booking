{% extends 'base.html' %}
{% load static %}

{% block title %}The Grand Reservations{% endblock %}

{% block styles %}
<style>

body{
    margin:0;
    font-family:'Poppins',sans-serif;
    background:#000;
    color:#fff;
    overflow-x:hidden;
}

/* LOADER */
#loader{
    position:fixed;
    width:100%;
    height:100%;
    background:#000;
    display:flex;
    justify-content:center;
    align-items:center;
    z-index:9999;
}

.loader-text{
    font-size:28px;
    letter-spacing:2px;
    margin-bottom:20px;
    animation:fadeText 1.5s ease infinite alternate;
}

.loader-bar{
    width:200px;
    height:3px;
    background:#333;
    overflow:hidden;
}

.loader-bar::after{
    content:"";
    display:block;
    width:40%;
    height:100%;
    background:#e50914;
    animation:loading 1.2s linear infinite;
}

@keyframes loading{
    0%{transform:translateX(-100%);}
    100%{transform:translateX(250%);}
}

@keyframes fadeText{
    from{opacity:0.5;}
    to{opacity:1;}
}

/* HERO */
.hero{
    position:relative;
    min-height:100vh;
    min-height:100dvh;
    height:auto;
    overflow:hidden;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:40px 15px;
}

.hero-bg{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    background:url("https://images.unsplash.com/photo-1476514525535-07fb3b4ae5f1") center/cover no-repeat;
    animation:zoomBg 20s ease-in-out infinite alternate;
    z-index:-2;
}

/* OVERLAY */
.hero::after{
    content:"";
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    background:linear-gradient(
        to top,
        rgba(0,0,0,0.95),
        rgba(0,0,0,0.5)
    );
    z-index:-1;
}

/* CONTENT */
.hero-content{
    width:100%;
    max-width:850px;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    text-align:center;
    animation:fadeUp 1.5s ease;
    padding:20px 10px;
}

/* TITLE */
.hero-title{
    font-size: clamp(30px, 6vw, 60px);
    font-weight:700;
    display:flex;
    flex-wrap:wrap;
    justify-content:center;
    align-items:center;
    perspective:1000px;
    line-height:1.2;
    margin-bottom:15px;
}

.hero-word{
    display:inline-flex;
    white-space:nowrap;
    margin:0 8px;
}

.hero-word > span{
    display:inline-block;
    opacity:0;
    transform:translateY(80px) scale(0.7) rotateX(90deg);
    animation:
        fadeZoom 1s ease forwards,
        floatWave 3s ease-in-out infinite;
    text-shadow:0 0 10px rgba(255,255,255,0.4);
}

/* STAGGER */
.hero-word:nth-child(1) span:nth-child(1){animation-delay:0.05s,1.2s;}
.hero-word:nth-child(1) span:nth-child(2){animation-delay:0.1s,1.3s;}
.hero-word:nth-child(1) span:nth-child(3){animation-delay:0.15s,1.4s;}
.hero-word:nth-child(1) span:nth-child(4){animation-delay:0.2s,1.5s;}
.hero-word:nth-child(1) span:nth-child(5){animation-delay:0.25s,1.6s;}
.hero-word:nth-child(1) span:nth-child(6){animation-delay:0.3s,1.7s;}

.hero-word:nth-child(2) span:nth-child(1){animation-delay:0.35s,1.8s;}
.hero-word:nth-child(2) span:nth-child(2){animation-delay:0.4s,1.9s;}
.hero-word:nth-child(2) span:nth-child(3){animation-delay:0.45s,2s;}
.hero-word:nth-child(2) span:nth-child(4){animation-delay:0.5s,2.1s;}
.hero-word:nth-child(2) span:nth-child(5){animation-delay:0.55s,2.2s;}
.hero-word:nth-child(2) span:nth-child(6){animation-delay:0.6s,2.3s;}

.hero-word:nth-child(3) span:nth-child(1){animation-delay:0.65s,2.4s;}
.hero-word:nth-child(3) span:nth-child(2){animation-delay:0.7s,2.5s;}
.hero-word:nth-child(3) span:nth-child(3){animation-delay:0.75s,2.6s;}
.hero-word:nth-child(3) span:nth-child(4){animation-delay:0.8s,2.7s;}
.hero-word:nth-child(3) span:nth-child(5){animation-delay:0.85s,2.8s;}
.hero-word:nth-child(3) span:nth-child(6){animation-delay:0.9s,2.9s;}

@keyframes fadeZoom{
    0%{opacity:0; transform:translateY(80px) scale(0.7) rotateX(90deg);}
    60%{opacity:1; transform:translateY(-10px) scale(1.05);}
    100%{opacity:1; transform:translateY(0) scale(1);}
}

@keyframes floatWave{
    0%{transform:translateY(0);}
    50%{transform:translateY(-6px);}
    100%{transform:translateY(0);}
}

/* BUTTON */
.btn-explore{
    background:#e50914;
    border:none;
    padding:14px 30px;
    font-size:16px;
    font-weight:600;
    margin-top:24px;
    border-radius:8px;
    color:#fff;
    text-decoration:none;
    display:inline-block;
    transition:transform 0.25s ease, background 0.25s ease, box-shadow 0.25s ease;
}

.btn-explore:hover{
    transform:scale(1.06);
    background:#ff1e1e;
    color:#fff;
    text-decoration:none;
    box-shadow:0 10px 25px rgba(229,9,20,0.5);
}

/* GLASS */
.glass-box{
    background:rgba(255,255,255,0.08);
    backdrop-filter:blur(12px);
    -webkit-backdrop-filter:blur(12px);
    padding:12px 22px;
    border-radius:30px;
    margin-top:14px;
    font-size:14px;
    line-height:1.4;
    max-width:92%;
    border:1px solid rgba(255,255,255,0.1);
    word-break:break-word;
}

@keyframes fadeUp{
    from{opacity:0; transform:translateY(40px);}
    to{opacity:1; transform:translateY(0);}
}

@keyframes zoomBg{
    from{transform:scale(1);}
    to{transform:scale(1.15);}
}

@media (max-width: 576px) {
    .hero{
        padding:25px 12px;
    }
    .hero-title{
        font-size:32px;
    }
    .hero-word{
        margin:3px 5px;
    }
    .glass-box{
        font-size:12px;
        padding:9px 15px;
        border-radius:20px;
    }
    .btn-explore{
        padding:12px 24px;
        font-size:14px;
        margin-top:18px;
    }
}

@media (max-width: 360px) {
    .hero-title{
        font-size:26px;
    }
    .glass-box{
        font-size:11px;
    }
}

</style>
{% endblock %}

{% block content %}

<div class="hero">

<div class="hero-bg"></div>

<div class="hero-content">

<h1 class="hero-title">
    <span class="hero-word">
        <span>T</span><span>r</span><span>a</span><span>v</span><span>e</span><span>l</span>
    </span>
    <span class="hero-word">
        <span>B</span><span>e</span><span>y</span><span>o</span><span>n</span><span>d</span>
    </span>
    <span class="hero-word">
        <span>L</span><span>i</span><span>m</span><span>i</span><span>t</span><span>s</span>
    </span>
</h1>

<div class="glass-box">
Luxury rooms • Exotic trips • Seamless booking
</div>

<div class="glass-box">
Experience premium travel like never before
</div>

<a href="{% url 'explore' %}" class="btn btn-explore">
Explore Now →
</a>

</div>

</div>

{% endblock %}
