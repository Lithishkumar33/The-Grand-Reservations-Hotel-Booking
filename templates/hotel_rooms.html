<h2>{{ hotel.name }} - Available Rooms</h2>

<div class="row">
{% for room in rooms %}
<div class="col-md-4">

    <div class="room-card">

        {% if room.images.first %}
            <img src="{{ room.images.first.image.url }}" class="room-img w-100">
        {% endif %}

        <div class="room-body">

            <h4>Room {{ room.room_number }}</h4>
            <p>{{ room.room_type }}</p>

            <p><strong>₹{{ room.price_room_only }}/day</strong></p>

            <a href="{% url 'room_detail' room.id %}" class="btn btn-book">
                Book Now →
            </a>

        </div>

    </div>

</div>
{% endfor %}
</div>
